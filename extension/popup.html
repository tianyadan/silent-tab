<!doctype html>
<html lang="zh-CN">

  <title>Silent Tab</title>
  <link rel="stylesheet" href="ui.css">

<body class="popup-page">

      <div class="console-brand compact"><div class="brand-mark"><span></span><span></span><span></span></div><div><strong>Silent Tab</strong><small>Browser Bridge</small></div></div>
